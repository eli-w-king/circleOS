<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>circleOS device stream</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #05070a;
      color: #f5f8fa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, #102431 0, #05070a 45%),
        #05070a;
    }
    main {
      width: min(680px, calc(100vw - 32px));
      padding: 40px;
      border: 1px solid #20303a;
      border-radius: 28px;
      background: rgb(8 13 17 / 88%);
      box-shadow: 0 30px 90px rgb(0 0 0 / 45%);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 24px; }
    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #91a0ae;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef5f67;
      box-shadow: 0 0 16px #ef5f67;
    }
    .connected .dot {
      background: #62e6a7;
      box-shadow: 0 0 16px #62e6a7;
    }
    .visual {
      min-height: 300px;
      display: grid;
      place-items: center;
    }
    .orb {
      width: 142px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 28%, #b8f2ff, #47d7ff 32%, #157ca7 70%);
      box-shadow: 0 0 80px rgb(71 215 255 / 30%);
      transform: scale(var(--level, .72));
      transition: transform 80ms linear, filter 80ms linear;
      filter: brightness(var(--brightness, .8));
    }
    .level-label {
      margin-top: -58px;
      text-align: center;
      color: #91a0ae;
      font-variant-numeric: tabular-nums;
    }
    .meter {
      height: 14px;
      overflow: hidden;
      border-radius: 99px;
      background: #162127;
    }
    .meter-fill {
      width: var(--meter, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #47d7ff, #62e6a7 75%, #ffd166);
      transition: width 80ms linear;
    }
    dl {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 24px 0 0;
    }
    dl div {
      min-width: 0;
      padding: 16px;
      border-radius: 16px;
      background: #0e161b;
    }
    dt { color: #71818d; font-size: 12px; }
    dd {
      margin: 8px 0 0;
      overflow: hidden;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hint { margin: 24px 0 0; color: #71818d; text-align: center; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: #47d7ff;
      color: #061017;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #1c2a32; color: #dce7ed; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .conversation {
      display: grid;
      gap: 10px;
      margin-top: 24px;
      padding: 18px;
      border-radius: 16px;
      background: #0e161b;
    }
    .conversation p { min-height: 20px; margin: 0; }
    .conversation strong { display: inline-block; width: 82px; color: #71818d; }
    .error { min-height: 20px; margin: 12px 0 0; color: #ef8a91; text-align: center; }
    @media (max-width: 560px) {
      main { padding: 24px; }
      dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>circleOS microphone stream</h1>
      <div id="connection" class="connection">
        <span class="dot"></span>
        <span id="connection-text">Waiting for device</span>
      </div>
    </header>
    <section class="visual" aria-label="Live microphone level">
      <div id="orb" class="orb"></div>
    </section>
    <div id="level-label" class="level-label">-96.0 dBFS</div>
    <div class="meter"><div id="meter-fill" class="meter-fill"></div></div>
    <dl>
      <div><dt>Received rate</dt><dd id="sample-rate">0 samples/s</dd></div>
      <div><dt>Audio received</dt><dd id="audio-seconds">0.0 seconds</dd></div>
      <div><dt>Device</dt><dd id="device-id">--</dd></div>
    </dl>
    <div class="controls">
      <button id="start-live">Start voice session</button>
      <button id="stop-live" class="secondary" disabled>Stop session</button>
    </div>
    <p id="live-error" class="error"></p>
    <section class="conversation" aria-label="Conversation transcript">
      <p><strong>You</strong><span id="input-transcript">Waiting for speech...</span></p>
      <p><strong>circleOS</strong><span id="output-transcript">Waiting for a response...</span></p>
    </section>
    <p class="hint">Tap the orb on the device to start or stop voice. Dashboard controls remain available as a fallback.</p>
  </main>
  <script src="/device-dashboard.js"></script>
</body>
</html>
